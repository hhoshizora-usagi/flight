<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フライト すごろく｜パタパタ</title>
<style>
:root{--bg:#070b10;--panel:#0e141c;--amber:#f5b13c;--ink:#e9eef2;--muted:#7f93a6;--line:#1c2733;--danger:#ff6b5e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#13202e 0%,#070b10 55%);color:var(--ink);font-family:Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 16px;gap:24px;overflow-x:hidden}
h1{font-size:22px;letter-spacing:.2em;color:var(--amber);font-weight:700}
.sub{font-size:12px;color:var(--muted);letter-spacing:.14em;margin-top:8px;text-align:center}
.board{width:min(820px,100%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 22px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px dashed var(--line);min-height:78px}
.row:last-child{border-bottom:0}
.row .k{width:110px;flex:none;font-size:12px;letter-spacing:.16em;color:var(--muted)}
.flaps{display:flex;gap:4px;flex-wrap:wrap;perspective:600px;min-width:0}
.flap{width:34px;height:46px;position:relative;perspective:300px;flex:none}
.flap .half{position:absolute;left:0;width:100%;height:50%;overflow:hidden;background:#0e1620;border:1px solid #1e2c3a}
.flap .half.top{top:0;border-radius:4px 4px 0 0;z-index:2;transform-origin:bottom;background:#111b25}
.flap .half.bot{top:50%;border-radius:0 0 4px 4px;z-index:1;background:#0b131c}
.flap .ch{position:absolute;left:0;width:100%;height:46px;display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:800;font-size:24px;line-height:1;font-family:"Courier New",Arial,sans-serif}
.flap .half.top .ch{top:0}
.flap .half.bot .ch{top:-23px}
.flap.flipping .half.top{animation:foldTop .17s ease-in}
.flap.flipping .half.bot{animation:unfoldBot .17s ease-out .17s}
@keyframes foldTop{from{transform:rotateX(0)}to{transform:rotateX(-92deg)}}
@keyframes unfoldBot{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.flap.hit .half{background:#2a0f0d;border-color:#5a1c16}
.flap.hit .ch{color:var(--danger)}
.choices{width:min(820px,100%);background:#160f0e;border:1px solid #5a1c16;border-radius:6px;padding:18px 20px;display:none;box-shadow:0 0 40px rgba(255,107,94,.15)}
.choices.show{display:block}
.choices-title{font-size:14px;letter-spacing:.14em;color:var(--danger);font-weight:700;margin-bottom:14px}
.choices-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices-btns button{border:1px solid #5a4130;background:#0e141c;color:var(--ink);font:inherit;font-size:13px;letter-spacing:.06em;padding:14px 10px;border-radius:4px;cursor:pointer;transition:.2s}
.choices-btns button:hover{border-color:var(--amber);color:var(--amber)}
.choices-btns button:active{transform:scale(.98)}
.choices-msg{margin-top:14px;font-size:13px;color:var(--amber);min-height:20px;line-height:1.7}
.cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
button.main{border:1px solid var(--amber);background:transparent;color:var(--amber);font:inherit;letter-spacing:.12em;font-size:13px;padding:13px 30px;border-radius:4px;cursor:pointer;transition:.25s}
button.main:hover:not(:disabled){background:var(--amber);color:#070b10}
button.main:disabled{opacity:.35;cursor:not-allowed}
.dice{width:70px;height:70px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--amber);font-weight:700;background:#0b1118}
.msg{font-size:13px;color:var(--muted);letter-spacing:.04em;min-height:22px;text-align:center;max-width:640px;line-height:1.8}
footer{font-size:11px;color:var(--muted);letter-spacing:.12em}
@media(max-width:560px){.row{flex-direction:column;align-items:flex-start;gap:8px}.row .k{width:auto}.choices-btns{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>フライト すごろく</h1>
<div class="sub">1人すごろく ✕ パタパタ（フリップボード）</div>

<div class="board">
  <div class="row"><div class="k">出発空港</div><div class="flaps" id="f-dep"></div></div>
  <div class="row"><div class="k">到着空港</div><div class="flaps" id="f-dest"></div></div>
  <div class="row"><div class="k">機体</div><div class="flaps" id="f-plane"></div></div>
  <div class="row"><div class="k">天候</div><div class="flaps" id="f-weather"></div></div>
  <div class="row"><div class="k">アクシデント</div><div class="flaps" id="f-acc"></div></div>
</div>

<div class="choices" id="choices">
  <div class="choices-title">到着空港クローズ！ どうする？</div>
  <div class="choices-btns">
    <button data-act="swap">別の空港に振り替える</button>
    <button data-act="hold">上空で待機する</button>
    <button data-act="force">強行着陸を試みる</button>
    <button data-act="abort">あきらめて引き返す</button>
  </div>
  <div class="choices-msg" id="choices-msg"></div>
</div>

<div class="cta">
  <button class="main" id="roll">サイコロを振る</button>
  <button class="main" id="again" disabled>もう一度</button>
  <button class="main" id="fly" disabled>離陸して飛ぶ！</button>
  <div class="dice" id="dice">–</div>
</div>
<div class="msg" id="msg">サイコロを振って、すごろくスタート。</div>
<footer>フライト すごろく / PATAPATA</footer>

<script>
(function(){
  var AIRPORTS=[
    {n:'羽田',p:'東京都'},
    {n:'成田',p:'千葉県'},
    {n:'伊丹',p:'大阪府'},
    {n:'関空',p:'大阪府'},
    {n:'那覇',p:'沖縄県'},
    {n:'新千歳',p:'北海道'},
    {n:'福岡',p:'福岡県'},
    {n:'中部',p:'愛知県'}
  ];
  var ADJ={
    '東京都':['千葉県','埼玉県','神奈川県','山梨県','群馬県'],
    '千葉県':['東京都','埼玉県','茨城県'],
    '大阪府':['奈良県','京都府','兵庫県','和歌山県'],
    '沖縄県':[],
    '北海道':[],
    '福岡県':['佐賀県','熊本県','大分県'],
    '愛知県':['静岡県','岐阜県','三重県','長野県']
  };
  var PLANES=['ボーイング787','エアバスA350','ボーイング737','エアバスA321'];
  var WEATHER=['晴れ','くもり','雨','雪','霧','向かい風','追い風'];
  var WEATHER_MSG={'晴れ':'視界良好、快適なフライト。','くもり':'雲が多めだが問題なし。','雨':'滑走路が濡れている。','雪':'滑走路の雪かきが必要。','霧':'視界不良、進入に注意。','向かい風':'向かい風で到着が遅れそう。','追い風':'追い風で早く着きそう。'};
  var ACCIDENTS=['なし','乱気流','エンジン片肺不調','燃料ギリギリ','到着空港クローズ','気圧急変'];
  var ACC_WEIGHT=[0,0,0,1,1,2,2,2,3,3,4,4,5];
  var GLYPHS='アイウエオカキクケコサシスセソタチツテトナニヌネノ空港機体天候風雨雪晴霧気流染料';

  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function isNear(dep, cand){
    if(cand.p===dep.p) return true;
    var adj=ADJ[dep.p]||[];
    return adj.indexOf(cand.p)!==-1;
  }
  function alternateFor(closed, dep){
    var samePref=AIRPORTS.filter(function(a){ return a.p===closed.p && a.n!==closed.n && a.n!==dep.n && !isNear(dep,a); });
    if(samePref.length) return pick(samePref);
    var cands=AIRPORTS.filter(function(a){ return a.n!==closed.n && a.n!==dep.n && !isNear(dep,a); });
    return cands.length ? pick(cands) : null;
  }

  function makeFlap(){
    var el=document.createElement('div'); el.className='flap';
    el.innerHTML='<div class="half top"><span class="ch"> </span></div><div class="half bot"><span class="ch"> </span></div>';
    return el;
  }
  function setFlap(el, ch){
    el.querySelectorAll('.ch').forEach(function(c){ c.textContent=ch; });
  }
  function flipTo(item, ch){
    setFlap(item, ch);
    item.classList.remove('flipping'); void item.offsetWidth; item.classList.add('flipping');
  }

  function flapGroup(container, text, baseDelay){
    container.innerHTML='';
    var chars=text.split('');
    var items=chars.map(function(){ var f=makeFlap(); container.appendChild(f); return f; });
    var settle=baseDelay;
    items.forEach(function(item, idx){
      var fch=chars[idx];
      var start=baseDelay+idx*110;
      var dur=520+idx*25;
      setTimeout(function(){
        var t=0;
        (function tick(){
          t+=100;
          if(t<dur){
            flipTo(item, GLYPHS[Math.floor(Math.random()*GLYPHS.length)]);
            setTimeout(tick, 105);
          } else {
            flipTo(item, fch);
            setTimeout(function(){ item.classList.remove('flipping'); }, 360);
          }
        })();
      }, start);
      settle=Math.max(settle, start+dur);
    });
    return settle;
  }

  var fDep=document.getElementById('f-dep');
  var fDest=document.getElementById('f-dest');
  var fPlane=document.getElementById('f-plane');
  var fWeather=document.getElementById('f-weather');
  var fAcc=document.getElementById('f-acc');
  var diceEl=document.getElementById('dice');
  var msg=document.getElementById('msg');
  var rollBtn=document.getElementById('roll');
  var againBtn=document.getElementById('again');
  var flyBtn=document.getElementById('fly');
  var choicesEl=document.getElementById('choices');
  var choicesMsg=document.getElementById('choices-msg');
  var busy=false;
  var closedAirport=null;
  var depAirport=null;
  var curDep='',curDest='',curPlane='',curWeather='',curAcc='';

  function hideChoices(){
    choicesEl.classList.remove('show');
    choicesMsg.textContent='';
  }

  function chooseAction(act){
    if(act==='swap'){
      var alt=alternateFor(closedAirport, depAirport);
      if(alt){
        choicesMsg.textContent='振り替え先：「'+alt.n+'」（'+alt.p+'）に着陸します。';
        flapGroup(fDest, alt.n, 80);
        curDest=alt.n;
      } else {
        choicesMsg.textContent='振り替えできる空港がありません。';
      }
    } else if(act==='hold'){
      choicesMsg.textContent='上空で周回して待機中…';
      (function(){
        var t=0;
        var timer=setInterval(function(){
          t++;
          if(t>=3){ clearInterval(timer); choicesMsg.textContent='少し待って、無事に着陸できました。'; }
          else { choicesMsg.textContent='上空で周回して待機中…'+'●'.repeat(t); }
        },500);
      })();
    } else if(act==='force'){
      var ok=Math.random()<0.5;
      choicesMsg.textContent=ok?'強行着陸… 成功！ 無事に着陸しました。':'強行着陸… 失敗！ 着陸をやり直します。';
    } else {
      choicesMsg.textContent='このフライトを中止して、引き返しました。';
    }
  }

  function start(){
    if(busy) return;
    busy=true;
    rollBtn.disabled=true; againBtn.disabled=true; flyBtn.disabled=true;
    hideChoices();
    closedAirport=null; depAirport=null; curDep='';curDest='';curPlane='';curWeather='';curAcc='';
    diceEl.textContent='–';
    [fDep,fDest,fPlane,fWeather,fAcc].forEach(function(el){ el.innerHTML=''; });

    var dice=1+Math.floor(Math.random()*6);
    var dep=pick(AIRPORTS);
    var candidates=AIRPORTS.filter(function(a){ return a.n!==dep.n && !isNear(dep,a); });
    if(!candidates.length){ candidates=AIRPORTS.filter(function(a){ return a.n!==dep.n; }); }
    var dest=pick(candidates);
    var plane=pick(PLANES);
    var weather=pick(WEATHER);
    var acc=ACCIDENTS[ACC_WEIGHT[Math.floor(Math.random()*ACC_WEIGHT.length)]];

    diceEl.textContent=dice;
    msg.textContent='サイコロは「'+dice+'」！ すごろくスタート。';

    var t1=flapGroup(fDep, dep.n, 100);
    var t2=flapGroup(fDest, dest.n, t1+220);
    var t3=flapGroup(fPlane, plane, t2+220);
    var t4=flapGroup(fWeather, weather, t3+220);
    var t5=flapGroup(fAcc, acc, t4+220);

    setTimeout(function(){
      if(acc!=='なし'){
        fAcc.querySelectorAll('.flap').forEach(function(c){ c.classList.add('hit'); });
      }
      var wx=WEATHER_MSG[weather]||'';
      var isClosed=(acc==='到着空港クローズ');
      var accMsg=isClosed?'到着空港がクローズ!! どうするか選んでね。':(acc==='なし'?'アクシデントなし、無事に到着。':'アクシデント発生!! 「'+acc+'」に備えて対応しよう。');
      msg.textContent='出発は「'+dep.n+'」→「'+dest.n+'」、機体は'+plane+'。天候は'+weather+'（'+wx+'）'+accMsg;
      if(isClosed){
        closedAirport=dest;
        depAirport=dep;
        choicesMsg.textContent='';
        choicesEl.classList.add('show');
      }
      curDep=dep.n; curDest=dest.n; curPlane=plane; curWeather=weather; curAcc=acc;
      flyBtn.disabled=false;
      busy=false;
      rollBtn.disabled=false; againBtn.disabled=false;
    }, t5+200);
  }

  choicesEl.querySelectorAll('.choices-btns button').forEach(function(b){
    b.addEventListener('click', function(){ chooseAction(b.getAttribute('data-act')); });
  });
  flyBtn.addEventListener('click', function(){
    if(!curDest) return;
    location.href='sim3d.html?dep='+encodeURIComponent(curDep)+'&dest='+encodeURIComponent(curDest)+'&plane='+encodeURIComponent(curPlane)+'&weather='+encodeURIComponent(curWeather)+'&acc='+encodeURIComponent(curAcc);
  });
  rollBtn.addEventListener('click', start);
  againBtn.addEventListener('click', start);
  setTimeout(start, 500);
})();
</script>
</body>
</html>
