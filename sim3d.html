<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フライト シミュレーター（3D）</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070b10;color:#e9eef2;font-family:Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#cv{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:13px;letter-spacing:.06em;z-index:5}
#hud .l{line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#hud .phase{font-size:20px;font-weight:700;color:#f5b13c}
#hud .cond{color:#c3d1dd;font-size:12px}
#hud .rt{color:#c3d1dd;font-size:12px;text-align:right;line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#back{position:fixed;left:16px;bottom:16px;border:1px solid #f5b13c;background:rgba(7,11,16,.75);color:#f5b13c;font:inherit;font-size:13px;letter-spacing:.06em;padding:10px 18px;border-radius:4px;cursor:pointer;text-decoration:none;z-index:6}
#back:hover{background:#f5b13c;color:#070b10}
#vt{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:6}
#vt button{border:1px solid #3a4a5a;background:rgba(7,11,16,.75);color:#c3d1dd;font:inherit;font-size:12px;letter-spacing:.06em;padding:9px 14px;border-radius:4px;cursor:pointer}
#vt button.on{border-color:#f5b13c;color:#f5b13c;background:rgba(245,177,60,.12)}
#cockpit{position:fixed;inset:0;pointer-events:none;display:none;z-index:3;font-family:Arial,"Noto Sans JP",sans-serif}
#cockpit.show{display:block}
.cp-struct{position:absolute;inset:0;pointer-events:none}
.cp-struct:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,#0d1319 30%,rgba(13,19,25,0));z-index:1}
.cp-struct:after{content:"";position:absolute;right:0;top:0;bottom:0;width:9%;background:linear-gradient(270deg,#0d1319 30%,rgba(13,19,25,0));z-index:1}
.cp-top{position:absolute;left:9%;right:9%;top:0;height:5%;background:linear-gradient(180deg,#0b1118 30%,rgba(11,17,24,0))}
.cp-mcp{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:42%;height:11%;background:linear-gradient(180deg,#141d26 0%,#0d141b 100%);border:1px solid #1c2933;border-radius:0 0 8px 8px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:3px 9px}
.mcp-row{display:flex;justify-content:center;gap:4px;align-items:center}
.mcp-knob{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2c3a47,#121922);border:1px solid #3a4c5c;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.mcp-knob:before{content:"";position:absolute;left:50%;top:2px;width:2px;height:3px;background:#8fa6ba;transform:translateX(-50%)}
.mcp-knob.kn{background:radial-gradient(circle at 35% 30%,#3b5468,#16222c);border-color:#4e6b82}
.mcp-lbl{color:#7f95a8;font-size:6px;letter-spacing:.16em;margin-top:1px;text-align:center}
.mcp-secs{display:flex;justify-content:center;gap:6px}
.mcp-sec{flex:none}
.mcp-caution{width:20px;height:20px;border-radius:4px;background:#2b1a10;border:1px solid #5a3a1e;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700;color:#e8a45a;box-shadow:0 0 8px rgba(232,164,90,.5)}
.cp-dash{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(180deg,#232e39 0%,#1a232d 15%,#0e151c 60%,#070b10 100%);border-top:2px solid #33465a;box-shadow:0 -12px 44px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.05);z-index:2}
.cp-panel{position:absolute;top:52%;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;justify-content:center;width:88%}
.cp-label{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);color:#5f7386;font-size:11px;letter-spacing:.24em;text-shadow:0 2px 6px rgba(0,0,0,.6);z-index:3}
.mfd{width:104px;height:70px;border-radius:4px;overflow:hidden;border:2px solid #26323d;box-shadow:0 4px 14px rgba(0,0,0,.55);position:relative;flex:none;background:#050a10}
.mfd .att{position:absolute;inset:0}
.mfd .sky{position:absolute;left:0;right:0;top:0;height:54%;background:linear-gradient(180deg,#2f6fa8,#5093c8)}
.mfd .gnd{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,#8a5a26,#5f4016)}
.mfd .hl{position:absolute;left:8%;right:8%;top:54%;height:2px;background:#eef4fa;box-shadow:0 0 5px rgba(0,0,0,.7)}
.mfd .pitch{position:absolute;left:50%;top:54%;width:30px;height:30px;border-left:1px solid rgba(255,255,255,.6);border-right:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}
.mfd .tick{position:absolute;left:50%;top:54%;width:60px;height:1px;background:rgba(255,255,255,.45);transform:translate(-50%,0)}
.mfd .lbl{position:absolute;left:6px;top:4px;font-size:8px;letter-spacing:.12em;color:#e6f0f8;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
.mfd .lbl b{color:#7fc4ea;font-size:7px}
.mfd .tape{position:absolute;right:5px;top:12px;bottom:12px;width:14px;background:rgba(0,0,0,.5);border:1px solid rgba(111,185,232,.5);display:flex;flex-direction:column;justify-content:space-between;font-size:7px;color:#cfeaff;padding:2px 0;align-items:center}
.mfd .spd{position:absolute;left:5px;top:12px;bottom:12px;width:14px;background:rgba(0,0,0,.5);border:1px solid rgba(111,185,232,.5);display:flex;flex-direction:column;justify-content:space-between;font-size:7px;color:#cfeaff;padding:2px 0;align-items:center}
.mfd.wide{width:140px}
.nd-rose{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%);opacity:.95}
.nd-rose text{font-family:"Courier New",monospace;fill:#9fe3c0;font-size:9px}
.nav{position:absolute;inset:0;pointer-events:none}
.nav .nd-to{position:absolute;left:7px;top:6px;font-size:10px;font-weight:700;color:#c8fad8;font-family:"Courier New",monospace;text-shadow:0 0 6px rgba(100,255,180,.4)}
.nav .nd-from{position:absolute;left:7px;bottom:7px;font-size:8px;color:#6fbf92;font-family:"Courier New",monospace}
.nav .nd-hdg{position:absolute;right:7px;top:6px;font-size:8px;color:#8fd8b0;font-family:"Courier New",monospace}
.nav .nd-rng{position:absolute;right:7px;bottom:7px;font-size:8px;color:#5fae82;font-family:"Courier New",monospace}
.gauge{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b333d,#0b0f14);border:2px solid #45505c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd27a;font-size:8px;letter-spacing:.06em;position:relative;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.gauge .ticks{position:absolute;inset:5px;border-radius:50%;background:repeating-conic-gradient(from -140deg,rgba(255,210,122,.9) 0deg 2deg,transparent 2deg 26deg);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%)}
.gauge .needle{position:absolute;left:50%;top:50%;width:26px;height:2px;background:#ffd27a;transform-origin:right center;transform:translate(-100%,-50%) rotate(var(--r,0deg));box-shadow:0 0 5px rgba(255,210,122,.8);z-index:2}
.gauge .cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#ffd27a;box-shadow:0 0 4px rgba(255,210,122,.8);z-index:3}
.gauge .v{font-size:12px;font-weight:700;color:#ffe9b8;line-height:1.1;margin-top:10px;position:relative;z-index:2}
.cp-pedestal{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:22%;height:8%;background:linear-gradient(180deg,#1a242e,#0e151d);border:1px solid #2a3a48;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;gap:18px;padding-top:6px;z-index:2;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
.thr{ width:11px;height:36px;background:linear-gradient(180deg,#2a3844,#121a22);border:1px solid #36495a;border-radius:3px;position:relative}
.thr:before{content:"";position:absolute;left:-4px;top:32%;width:17px;height:12px;border-radius:4px;background:linear-gradient(180deg,#4f6276,#2c3a46);border:1px solid #5f7689;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.yoke{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);width:196px;height:42px;z-index:2}
.yoke-bar{position:absolute;left:7%;right:7%;top:2px;height:9px;border-radius:6px;background:linear-gradient(180deg,#55697d,#2c3946);border:1px solid #64798e;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.yoke-grip{position:absolute;top:0;width:28px;height:30px;border-radius:8px;background:linear-gradient(180deg,#55697d,#2c3946);border:1px solid #64798e;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.yoke-grip.l{left:3%}.yoke-grip.r{right:3%}
.yoke-hub{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d4e5e,#1f2830);border:2px solid #5c7084;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.sstick{position:absolute;bottom:12%;left:18%;width:11px;height:44px;border-radius:8px;background:linear-gradient(180deg,#3a4a5a,#232e38);border:2px solid #55697d;transform:rotate(-15deg);box-shadow:0 4px 12px rgba(0,0,0,.55);z-index:2}
.sstick:before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:20px;border-radius:7px;background:linear-gradient(180deg,#4a5a6a,#2c3946);border:2px solid #55697d}
.sstick.r{left:auto;right:18%;transform:rotate(15deg)}
.ct-787 .cp-dash{height:16%;background:linear-gradient(180deg,#26323f 0%,#1b2530 12%,#0f161d 55%,#070b10 100%)}
.ct-a350 .cp-dash{height:16%;background:linear-gradient(180deg,#1a242f 0%,#121b24 15%,#0b1118 60%,#070b10 100%)}
.ct-a350 .mfd{width:72px;height:50px}
.ct-a350 .cp-panel{gap:6px;width:90%}
.ct-a350 .cp-sw.lit{background:#3a2a12;border-color:#8a6a2a;box-shadow:0 0 8px rgba(240,180,80,.7), inset 0 0 4px rgba(240,180,80,.5)}
.ct-a350 .nd-rose{width:56px;height:56px}
.ct-737 .cp-dash{height:20%;background:linear-gradient(180deg,#2b343f 0%,#222b35 15%,#141b22 65%,#090d12 100%)}
.ct-a321 .cp-dash{height:17%;background:linear-gradient(180deg,#1b2530 0%,#141c25 15%,#0c1218 60%,#070b10 100%)}
/* 管制塔無線パネル */
#radio{position:fixed;left:18px;top:86px;width:min(430px,calc(100vw - 36px));pointer-events:none;z-index:4;font-family:"Courier New",monospace;transition:opacity .35s}
#radio .r-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#radio .r-dot{width:8px;height:8px;border-radius:50%;background:#33414f;border:1px solid #46596b;transition:background .2s, box-shadow .2s;flex:none}
#radio .r-dot.on{background:#6dcfff;box-shadow:0 0 10px #6dcfff}
#radio .r-name{font-size:14px;font-weight:700;letter-spacing:.1em;color:#eaf4ff;text-shadow:0 0 10px rgba(109,207,255,.45);white-space:nowrap}
#radio .r-freq{font-size:11px;letter-spacing:.14em;color:#9fd8ff;text-shadow:0 0 6px rgba(109,207,255,.5);white-space:nowrap}
#radio .r-tag{font-size:10px;letter-spacing:.1em;color:#7f93a6;margin-left:auto;white-space:nowrap}
#radio .r-box{background:rgba(7,12,18,.82);border:1px solid #24323f;border-radius:5px;padding:9px 12px;box-shadow:0 12px 34px rgba(0,0,0,.55);backdrop-filter:blur(2px)}
#radio .r-line{font-size:11.5px;line-height:1.55;letter-spacing:.02em;color:#b9c9d8;opacity:.5;transition:opacity .3s, color .3s}
#radio .r-line.now{opacity:1;color:#f3f8fc;text-shadow:0 0 8px rgba(160,220,255,.25)}
#radio .r-line .who{color:#8fd8b0}
#radio .r-line.now .who{color:#a7f2c6}
#radio .r-line .who.crew{color:#f5b13c}
#radio .r-line.now .who.crew{color:#ffcf73}
#radio .r-noise{font-size:11px;color:#4a7188;letter-spacing:.18em;margin-top:4px;height:14px;overflow:hidden;white-space:nowrap}
@keyframes rk-out{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="l"><div class="phase" id="phase">タキシング</div><div class="cond" id="cond"></div></div>
  <div class="rt" id="rt"></div>
</div>
<div id="radio">
  <div class="r-head">
    <span class="r-dot" id="rDot"></span>
    <span class="r-name" id="rName">管制塔</span>
    <span class="r-freq" id="rFreq">TWR 118.100</span>
    <span class="r-tag" id="rTag">管制塔</span>
  </div>
  <div class="r-box" id="rBox"></div>
</div>
<div id="cockpit"></div>
<div id="vt">
  <button id="vChase">後方追跡</button>
  <button id="vCockpit">コックピット（操縦席）</button>
</div>
<a id="back" href="index.html">← すごろくに戻る</a>
