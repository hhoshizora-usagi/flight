<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フライト シミュレーター（3D）</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070b10;color:#e9eef2;font-family:Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#cv{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:13px;letter-spacing:.06em;z-index:5}
#hud .l{line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#hud .phase{font-size:20px;font-weight:700;color:#f5b13c}
#hud .cond{color:#c3d1dd;font-size:12px}
#hud .rt{color:#c3d1dd;font-size:12px;text-align:right;line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#back{position:fixed;left:16px;bottom:16px;border:1px solid #f5b13c;background:rgba(7,11,16,.75);color:#f5b13c;font:inherit;font-size:13px;letter-spacing:.06em;padding:10px 18px;border-radius:4px;cursor:pointer;text-decoration:none;z-index:6}
#back:hover{background:#f5b13c;color:#070b10}
#vt{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:6}
#vt button{border:1px solid #3a4a5a;background:rgba(7,11,16,.75);color:#c3d1dd;font:inherit;font-size:12px;letter-spacing:.06em;padding:9px 14px;border-radius:4px;cursor:pointer}
#vt button.on{border-color:#f5b13c;color:#f5b13c;background:rgba(245,177,60,.12)}
#cockpit{position:fixed;inset:0;pointer-events:none;display:none;z-index:3;font-family:Arial,"Noto Sans JP",sans-serif}
#cockpit.show{display:block}
.cp-struct{position:absolute;inset:0;pointer-events:none}
.cp-struct:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,#0d1319 30%,rgba(13,19,25,0));z-index:1}
.cp-struct:after{content:"";position:absolute;right:0;top:0;bottom:0;width:9%;background:linear-gradient(270deg,#0d1319 30%,rgba(13,19,25,0));z-index:1}
.cp-top{position:absolute;left:9%;right:9%;top:0;height:5%;background:linear-gradient(180deg,#0b1118 30%,rgba(11,17,24,0))}
.cp-mcp{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:42%;height:11%;background:linear-gradient(180deg,#141d26 0%,#0d141b 100%);border:1px solid #1c2933;border-radius:0 0 8px 8px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:3px 9px}
.mcp-row{display:flex;justify-content:center;gap:4px;align-items:center}
.mcp-knob{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2c3a47,#121922);border:1px solid #3a4c5c;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.mcp-knob:before{content:"";position:absolute;left:50%;top:2px;width:2px;height:3px;background:#8fa6ba;transform:translateX(-50%)}
.mcp-knob.kn{background:radial-gradient(circle at 35% 30%,#3b5468,#16222c);border-color:#4e6b82}
.mcp-lbl{color:#7f95a8;font-size:6px;letter-spacing:.16em;margin-top:1px;text-align:center}
.mcp-secs{display:flex;justify-content:center;gap:6px}
.mcp-sec{flex:none}
.mcp-caution{width:20px;height:20px;border-radius:4px;background:#2b1a10;border:1px solid #5a3a1e;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700;color:#e8a45a;box-shadow:0 0 8px rgba(232,164,90,.5)}
.cp-dash{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(180deg,#232e39 0%,#1a232d 15%,#0e151c 60%,#070b10 100%);border-top:2px solid #33465a;box-shadow:0 -12px 44px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.05);z-index:2}
.cp-panel{position:absolute;top:52%;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;justify-content:center;width:88%}
.cp-label{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);color:#5f7386;font-size:11px;letter-spacing:.24em;text-shadow:0 2px 6px rgba(0,0,0,.6);z-index:3}
.mfd{width:104px;height:70px;border-radius:4px;overflow:hidden;border:2px solid #26323d;box-shadow:0 4px 14px rgba(0,0,0,.55);position:relative;flex:none;background:#050a10}
.mfd .att{position:absolute;inset:0}
.mfd .sky{position:absolute;left:0;right:0;top:0;height:54%;background:linear-gradient(180deg,#2f6fa8,#5093c8)}
.mfd .gnd{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,#8a5a26,#5f4016)}
.mfd .hl{position:absolute;left:8%;right:8%;top:54%;height:2px;background:#eef4fa;box-shadow:0 0 5px rgba(0,0,0,.7)}
.mfd .pitch{position:absolute;left:50%;top:54%;width:30px;height:30px;border-left:1px solid rgba(255,255,255,.6);border-right:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}
.mfd .tick{position:absolute;left:50%;top:54%;width:60px;height:1px;background:rgba(255,255,255,.45);transform:translate(-50%,0)}
.mfd .lbl{position:absolute;left:6px;top:4px;font-size:8px;letter-spacing:.12em;color:#e6f0f8;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
.mfd .lbl b{color:#7fc4ea;font-size:7px}
.mfd .tape{position:absolute;right:5px;top:12px;bottom:12px;width:14px;background:rgba(0,0,0,.5);border:1px solid rgba(111,185,232,.5);display:flex;flex-direction:column;justify-content:space-between;font-size:7px;color:#cfeaff;padding:2px 0;align-items:center}
.mfd .spd{position:absolute;left:5px;top:12px;bottom:12px;width:14px;background:rgba(0,0,0,.5);border:1px solid rgba(111,185,232,.5);display:flex;flex-direction:column;justify-content:space-between;font-size:7px;color:#cfeaff;padding:2px 0;align-items:center}
.mfd.wide{width:140px}
.nd-rose{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%);opacity:.95}
.nd-rose text{font-family:"Courier New",monospace;fill:#9fe3c0;font-size:9px}
.nav{position:absolute;inset:0;pointer-events:none}
.nav .nd-to{position:absolute;left:7px;top:6px;font-size:10px;font-weight:700;color:#c8fad8;font-family:"Courier New",monospace;text-shadow:0 0 6px rgba(100,255,180,.4)}
.nav .nd-from{position:absolute;left:7px;bottom:7px;font-size:8px;color:#6fbf92;font-family:"Courier New",monospace}
.nav .nd-hdg{position:absolute;right:7px;top:6px;font-size:8px;color:#8fd8b0;font-family:"Courier New",monospace}
.nav .nd-rng{position:absolute;right:7px;bottom:7px;font-size:8px;color:#5fae82;font-family:"Courier New",monospace}
.gauge{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b333d,#0b0f14);border:2px solid #45505c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd27a;font-size:8px;letter-spacing:.06em;position:relative;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.gauge .ticks{position:absolute;inset:5px;border-radius:50%;background:repeating-conic-gradient(from -140deg,rgba(255,210,122,.9) 0deg 2deg,transparent 2deg 26deg);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%)}
.gauge .needle{position:absolute;left:50%;top:50%;width:26px;height:2px;background:#ffd27a;transform-origin:right center;transform:translate(-100%,-50%) rotate(var(--r,0deg));box-shadow:0 0 5px rgba(255,210,122,.8);z-index:2}
.gauge .cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#ffd27a;box-shadow:0 0 4px rgba(255,210,122,.8);z-index:3}
.gauge .v{font-size:12px;font-weight:700;color:#ffe9b8;line-height:1.1;margin-top:10px;position:relative;z-index:2}
.cp-pedestal{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:22%;height:8%;background:linear-gradient(180deg,#1a242e,#0e151d);border:1px solid #2a3a48;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;gap:18px;padding-top:6px;z-index:2;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
.thr{ width:11px;height:36px;background:linear-gradient(180deg,#2a3844,#121a22);border:1px solid #36495a;border-radius:3px;position:relative}
.thr:before{content:"";position:absolute;left:-4px;top:32%;width:17px;height:12px;border-radius:4px;background:linear-gradient(180deg,#4f6276,#2c3a46);border:1px solid #5f7689;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.yoke{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);width:196px;height:42px;z-index:2}
.yoke-bar{position:absolute;left:7%;right:7%;top:2px;height:9px;border-radius:6px;background:linear-gradient(180deg,#55697d,#2c3946);border:1px solid #64798e;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.yoke-grip{position:absolute;top:0;width:28px;height:30px;border-radius:8px;background:linear-gradient(180deg,#55697d,#2c3946);border:1px solid #64798e;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.yoke-grip.l{left:3%}.yoke-grip.r{right:3%}
.yoke-hub{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d4e5e,#1f2830);border:2px solid #5c7084;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.sstick{position:absolute;bottom:12%;left:18%;width:11px;height:44px;border-radius:8px;background:linear-gradient(180deg,#3a4a5a,#232e38);border:2px solid #55697d;transform:rotate(-15deg);box-shadow:0 4px 12px rgba(0,0,0,.55);z-index:2}
.sstick:before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:20px;border-radius:7px;background:linear-gradient(180deg,#4a5a6a,#2c3946);border:2px solid #55697d}
.sstick.r{left:auto;right:18%;transform:rotate(15deg)}
.ct-787 .cp-dash{height:16%;background:linear-gradient(180deg,#26323f 0%,#1b2530 12%,#0f161d 55%,#070b10 100%)}
.ct-a350 .cp-dash{height:16%;background:linear-gradient(180deg,#1a242f 0%,#121b24 15%,#0b1118 60%,#070b10 100%)}
.ct-a350 .mfd{width:72px;height:50px}
.ct-a350 .cp-panel{gap:6px;width:90%}
.ct-a350 .cp-sw.lit{background:#3a2a12;border-color:#8a6a2a;box-shadow:0 0 8px rgba(240,180,80,.7), inset 0 0 4px rgba(240,180,80,.5)}
.ct-a350 .nd-rose{width:56px;height:56px}
.ct-737 .cp-dash{height:20%;background:linear-gradient(180deg,#2b343f 0%,#222b35 15%,#141b22 65%,#090d12 100%)}
.ct-a321 .cp-dash{height:17%;background:linear-gradient(180deg,#1b2530 0%,#141c25 15%,#0c1218 60%,#070b10 100%)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="l"><div class="phase" id="phase">タキシング</div><div class="cond" id="cond"></div></div>
  <div class="rt" id="rt"></div>
</div>
<div id="cockpit"></div>
<div id="vt">
  <button id="vChase">後方追跡</button>
  <button id="vCockpit">コックピット（操縦席）</button>
</div>
<a id="back" href="index.html">← すごろくに戻る</a>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
"use strict";
var q = new URLSearchParams(location.search);
var dep = q.get("dep") || "羽田";
var dest = q.get("dest") || "釧路";
var plane = q.get("plane") || "ボーイング787";
var weather = q.get("weather") || "晴れ";
var acc = q.get("acc") || "なし";

var AC = {
  "ボーイング787": { len:20, span:28, color:0xdfe6ee, cls:"ct-787", sideStick:false, style:"glass", vr:152, vcr:490 },
  "エアバスA350": { len:19, span:27, color:0xe8edf2, cls:"ct-a350", sideStick:true, style:"six", vr:148, vcr:488 },
  "ボーイング737": { len:15, span:22, color:0xd8dee6, cls:"ct-737", sideStick:false, style:"round", vr:142, vcr:450 },
  "エアバスA321": { len:14, span:21, color:0xe4e9ef, cls:"ct-a321", sideStick:true, style:"four", vr:138, vcr:447 }
};
var ac = AC[plane] || AC["ボーイング787"];
var VCR = ac.vcr || 280;

var CRUISE_HDG = 92;
var CRUISE_ALT = 30000;

function smooth(a, b, x){ x = Math.max(0, Math.min(1, x)); var u = x*x*(3-2*x); return a + (b-a)*u; }
function easeOut(x){ x = Math.max(0, Math.min(1, x)); return 1 - (1-x)*(1-x); }

function stagedDescend(progress, stages){
  var x = Math.min(progress*stages, stages-0.0001);
  var i = Math.floor(x);
  var f = x - i;
  var e = f*f*(3-2*f);
  return CRUISE_ALT * (1 - (i + e) / stages);
}

document.getElementById("cond").textContent = dep + " → " + dest + " / " + plane + " / " + weather + (acc && acc!=="なし" ? " / " + acc : "");
var rtEl = document.getElementById("rt");
var phaseEl = document.getElementById("phase");

var canvas = document.getElementById("cv");
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);

var scene = new THREE.Scene();
var cam = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.5, 300000);

var SKYC = { "晴れ":[0x0f5fb8,0xd0e8fb], "くもり":[0x7f95a8,0xc7d2da], "雨":[0x3d4c59,0x8a99a6], "雪":[0x7d8b98,0xd3dbe2], "霧":[0x9aa6b0,0xc9d1d8], "向かい風":[0x0f5fb8,0xd0e8fb], "追い風":[0x0f5fb8,0xd0e8fb] };
var sc = SKYC[weather] || SKYC["晴れ"];
var skyTop = new THREE.Color(sc[0]), skyBot = new THREE.Color(sc[1]);
var fogColor = skyBot.clone().lerp(skyTop, 0.2);
scene.fog = new THREE.Fog(fogColor, weather==="霧"?60:(weather==="雨"?300:1200), weather==="霧"?340:(weather==="雨"?1200:6000));

var skyCanvas = document.createElement("canvas");
skyCanvas.width = 4; skyCanvas.height = 256;
var sctx = skyCanvas.getContext("2d");
var lg = sctx.createLinearGradient(0,0,0,256);
lg.addColorStop(0, "#"+skyTop.getHexString());
lg.addColorStop(1, "#"+skyBot.getHexString());
sctx.fillStyle = lg;
sctx.fillRect(0,0,4,256);
var skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.magFilter = THREE.LinearFilter;
scene.background = skyTex;

var sun = new THREE.DirectionalLight(0xfff2d0, 1.8); sun.position.set(120,420,80); scene.add(sun);
var hemi = new THREE.HemisphereLight(0xffffff, 0x3a4a2a, 1.0); scene.add(hemi);
var sunDisk = new THREE.Mesh(new THREE.SphereGeometry(60,16,12), new THREE.MeshBasicMaterial({color:0xfff4d6}));
sunDisk.position.set(900,2100,-2200); scene.add(sunDisk);

// distant mountains (far range)
var mtnMat = new THREE.MeshStandardMaterial({color:0x5d6f7a, roughness:1});
for(var mi=0; mi<14; mi++){
  var mtn = new THREE.Mesh(new THREE.ConeGeometry(260+Math.random()*180, 220+Math.random()*180, 8), mtnMat);
  var ang = mi*(Math.PI*2/14) + 0.2;
  mtn.position.set(Math.cos(ang)*(-1600+Math.random()*200), -30, Math.sin(ang)*(-1600+Math.random()*200)-600);
  scene.add(mtn);
}

var gGeo = new THREE.PlaneGeometry(6000,6000,120,120); gGeo.rotateX(-Math.PI/2);
var gp = gGeo.attributes.position;
for(var gi=0;gi<gp.count;gi++){ var gx=gp.getX(gi), gz=gp.getZ(gi); var dist0=Math.sqrt(gx*gx+gz*gz); var amp=Math.min(dist0/900,1); var h=(Math.sin(gx*0.0035)*9+Math.cos(gz*0.0028)*12+Math.sin((gx+gz)*0.0019)*15)*amp; gp.setY(gi,h); }
gGeo.computeVertexNormals();
var ground = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({color:0x35502e, roughness:1})); ground.position.y=-30; scene.add(ground);
var water = new THREE.Mesh(new THREE.PlaneGeometry(6000,2400), new THREE.MeshStandardMaterial({color:0x1b5a86, roughness:0.3, metalness:0.35})); water.rotation.x=-Math.PI/2; water.position.set(0,-31.2,3200); scene.add(water);
for(var bi=0;bi<60;bi++){ var bh=30+Math.random()*120; var b=new THREE.Mesh(new THREE.BoxGeometry(16+Math.random()*22,bh,16+Math.random()*22), new THREE.MeshStandardMaterial({color:0x4a5866, roughness:0.85})); b.position.set(-1400+Math.random()*2800,-30+bh/2,-1800-Math.random()*1600); scene.add(b); }

var runway = new THREE.Mesh(new THREE.PlaneGeometry(120,3400), new THREE.MeshStandardMaterial({color:0x5b646d, roughness:0.7, emissive:0x222a33, emissiveIntensity:0.7})); runway.rotation.x=-Math.PI/2; runway.position.set(0,-29.75,-900); scene.add(runway);
var dashMat = new THREE.MeshBasicMaterial({color:0xf8fbff});
for(var di=0;di<50;di++){ var d=new THREE.Mesh(new THREE.PlaneGeometry(6,40), dashMat); d.rotation.x=-Math.PI/2; d.position.set(0,-29.1,-1450+di*70); scene.add(d); }
for(var el=-1; el<=1; el+=2){
  var line = new THREE.Mesh(new THREE.PlaneGeometry(3.2,3200), dashMat); line.rotation.x=-Math.PI/2; line.position.set(el*56, -29.15, -900); scene.add(line);
}
for(var tci=0;tci<2;tci++){
  var tcz = (tci===0) ? -2470 : 670;
  for(var tk=0;tk<8;tk++){
    var ts = new THREE.Mesh(new THREE.PlaneGeometry(5,22), dashMat);
    ts.rotation.x=-Math.PI/2;
    ts.position.set(-42+tk*12, -29.1, tcz);
    scene.add(ts);
  }
}

var edgeLampMat = new THREE.MeshBasicMaterial({color:0xfff0c0});
for(var ei=0; ei<60; ei++){
  var ez = -2450 + ei*50;
  for(var sd=-1; sd<=1; sd+=2){
    var el2 = new THREE.Mesh(new THREE.SphereGeometry(2.2,8,6), edgeLampMat);
    el2.position.set(sd*62, -29.2, ez); scene.add(el2);
  }
}
var appLampMat = new THREE.MeshBasicMaterial({color:0xffe9a8});
for(var ai=0; ai<12; ai++){
  var ap = new THREE.Mesh(new THREE.SphereGeometry(2.0,8,6), appLampMat);
  ap.position.set(0, -29.2, -2470 - ai*60); scene.add(ap);
}
var thrLampMat = new THREE.MeshBasicMaterial({color:0xffd060});
for(var tli=0; tli<10; tli++){
  var tl = new THREE.Mesh(new THREE.SphereGeometry(1.8,8,6), thrLampMat);
  tl.position.set(-45+tli*10, -29.2, -2440); scene.add(tl);
}
function makeRwyNum(txt){
  var rcv = document.createElement("canvas"); rcv.width=256; rcv.height=256;
  var rcx = rcv.getContext("2d");
  rcx.clearRect(0,0,256,256);
  rcx.fillStyle = "#f8fbff"; rcx.font = "bold 190px Arial";
  rcx.textAlign="center"; rcx.textBaseline="middle";
  rcx.fillText(txt, 128, 128);
  var rtx = new THREE.CanvasTexture(rcv);
  var m = new THREE.Mesh(new THREE.PlaneGeometry(36,36), new THREE.MeshBasicMaterial({map:rtx, transparent:true}));
  m.rotation.x=-Math.PI/2;
  return m;
}
var rn09 = makeRwyNum("09"); rn09.position.set(0,-29.5,-2380); scene.add(rn09);
var rn27 = makeRwyNum("27"); rn27.rotation.z=Math.PI; rn27.position.set(0,-29.5,720); scene.add(rn27);

var CLOUD_CFG = {
  "晴れ":     { n:5, color:0xffffff, op:0.3, drift:8 },
  "くもり":   { n:36, color:0xdfe6ec, op:0.7, drift:8 },
  "雨":       { n:44, color:0x8a97a2, op:0.8, drift:18 },
  "雪":       { n:38, color:0xffffff, op:0.85, drift:6 },
  "霧":       { n:52, color:0xdfe6ec, op:0.9, drift:3 },
  "向かい風": { n:20, color:0xffffff, op:0.5, drift:26 },
  "追い風":   { n:16, color:0xffffff, op:0.45, drift:5 }
};
var cfg = CLOUD_CFG[weather] || CLOUD_CFG["晴れ"];
var cloudMat = new THREE.MeshLambertMaterial({color:cfg.color, transparent:true, opacity:cfg.op, fog:false});
var clouds=[];
for(var c=0;c<cfg.n;c++){
  var cl=new THREE.Mesh(new THREE.SphereGeometry(220+Math.random()*320,10,8), cloudMat);
  cl.scale.set(1.8,0.65,1.35);
  cl.position.set((Math.random()-0.5)*12000, 23000+Math.random()*11000, -15000+Math.random()*24000);
  scene.add(cl); clouds.push(cl);
}

var planeGroup = new THREE.Group(); scene.add(planeGroup);
var bodyMat = new THREE.MeshStandardMaterial({color:ac.color, roughness:0.45, metalness:0.2});
var wingMat = new THREE.MeshStandardMaterial({color:0xcfd6de, roughness:0.55});
var glassMat = new THREE.MeshStandardMaterial({color:0x22303c, roughness:0.15, metalness:0.5});
var stripeMat = new THREE.MeshStandardMaterial({color:0x2d6fb0, roughness:0.5});
var engMat = new THREE.MeshStandardMaterial({color:0xb9c3cc, roughness:0.45, metalness:0.35});
var gearMat = new THREE.MeshStandardMaterial({color:0x22282e, roughness:0.8});

var fus = new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,ac.len,24), bodyMat); fus.rotation.z=Math.PI/2; planeGroup.add(fus);
var nose = new THREE.Mesh(new THREE.ConeGeometry(2.1,4.6,24), bodyMat); nose.rotation.z=-Math.PI/2; nose.position.x=ac.len/2+2.3; planeGroup.add(nose);
var tailCone = new THREE.Mesh(new THREE.ConeGeometry(2.1,5.5,24), bodyMat); tailCone.rotation.z=Math.PI/2; tailCone.position.x=-ac.len/2-2.75; planeGroup.add(tailCone);
var ck = new THREE.Mesh(new THREE.SphereGeometry(1.4,14,12), glassMat); ck.scale.set(1,0.8,1); ck.position.set(ac.len/2-0.6,0.9,0); planeGroup.add(ck);
var wingL = new THREE.Mesh(new THREE.BoxGeometry(ac.span*0.5,0.5,6.2), wingMat); wingL.position.set(-1.0,-0.3,-ac.span*0.24); wingL.rotation.y=-0.13; planeGroup.add(wingL);
var wingR = new THREE.Mesh(new THREE.BoxGeometry(ac.span*0.5,0.5,6.2), wingMat); wingR.position.set(-1.0,-0.3,ac.span*0.24); wingR.rotation.y=0.13; planeGroup.add(wingR);
var strL = new THREE.Mesh(new THREE.BoxGeometry(ac.len*0.85,0.35,0.08), stripeMat); strL.position.set(0,0.3,2.12); planeGroup.add(strL);
var strR = new THREE.Mesh(new THREE.BoxGeometry(ac.len*0.85,0.35,0.08), stripeMat); strR.position.set(0,0.3,-2.12); planeGroup.add(strR);
for(var e=-1;e<=1;e+=2){
  var eng = new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.15,5.2,18), engMat); eng.rotation.x=Math.PI/2; eng.position.set(-1.0,-1.35,e*ac.span*0.30); planeGroup.add(eng);
  var nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.75,1.2,16), glassMat); nozzle.rotation.x=Math.PI/2; nozzle.position.set(-1.0-3.2,-1.35,e*ac.span*0.30); planeGroup.add(nozzle);
  var pylon = new THREE.Mesh(new THREE.BoxGeometry(3.4,0.4,0.8), wingMat); pylon.position.set(-1.0,-0.75,e*ac.span*0.30); planeGroup.add(pylon);
}
var vfin = new THREE.Mesh(new THREE.BoxGeometry(0.45,5.4,5.0), wingMat); vfin.position.set(-ac.len/2+0.6,2.7,0); planeGroup.add(vfin);
var hstab = new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,9.5), wingMat); hstab.position.set(-ac.len/2+0.4,0.7,0); planeGroup.add(hstab);

var gearGroup = new THREE.Group(); planeGroup.add(gearGroup);
for(var g=0; g<3; g++){
  var gx = (g===2)? ac.len*0.28 : -ac.len*0.2;
  var gz = (g===0)? ac.span*0.24 : (g===1? -ac.span*0.24 : 0);
  var wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.6,14), gearMat); wheel.rotation.x=Math.PI/2; wheel.position.set(gx,-2.6,gz); gearGroup.add(wheel);
  var strut = new THREE.Mesh(new THREE.BoxGeometry(0.2,1.0,0.2), wingMat); strut.position.set(gx,-2.0,gz); gearGroup.add(strut);
}

var rain=null, snow=null;
if(weather==="雨"){ var rn=1600,rg=new THREE.BufferGeometry(); var rp=new Float32Array(rn*3); for(var i2=0;i2<rn;i2++){ rp[i2*3]=(Math.random()-0.5)*260; rp[i2*3+1]=Math.random()*130-10; rp[i2*3+2]=(Math.random()-0.5)*260; } rg.setAttribute("position",new THREE.BufferAttribute(rp,3)); rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0xaac4dd,size:0.6,transparent:true,opacity:0.7})); scene.add(rain); }
if(weather==="雪"){ var sn=1000,sg=new THREE.BufferGeometry(); var sp=new Float32Array(sn*3); for(var j2=0;j2<sn;j2++){ sp[j2*3]=(Math.random()-0.5)*260; sp[j2*3+1]=Math.random()*130-10; sp[j2*3+2]=(Math.random()-0.5)*260; } sg.setAttribute("position",new THREE.BufferAttribute(sp,3)); snow=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.1,transparent:true,opacity:0.85})); scene.add(snow); }

function pfdHTML(label, side, wide){
  var tag = '<span class="lbl">'+label+(side?' <b>'+side+'</b>':'')+'</span>';
  return '<div class="mfd'+(wide?' wide':'')+'"><div class="att"><div class="sky"></div><div class="gnd"></div><div class="hl"></div><div class="pitch"></div><div class="tick" style="top:44%"></div><div class="tick" style="top:64%"></div></div>'+tag+'<span class="spd"><span>240</span><span>260</span><span>280</span></span><span class="tape"><span>090</span><span>092</span><span>094</span></span></div>';
}
function ndHTML(label, side, wide){
  var tag = '<span class="lbl">'+label+(label?' <b>'+side+'</b>':'')+'</span>';
  var svg = '<svg class="nd-rose" viewBox="0 0 100 100">'
    + '<circle cx="50" cy="50" r="38" fill="none" stroke="rgba(111,232,160,.3)" stroke-width="1"/>'
    + '<circle cx="50" cy="50" r="30" fill="none" stroke="rgba(111,232,160,.15)" stroke-width="1"/>'
    + '<text x="50" y="11">N</text>'
    + '<line x1="50" y1="74" x2="50" y2="30" stroke="rgba(170,255,205,.85)" stroke-width="1.4" stroke-dasharray="4 3"/>'
    + '<polygon points="50,26 45,35 55,35" fill="#c8fad8"/>'
    + '<circle cx="50" cy="62" r="2.6" fill="#b5f5c8"/>'
    + '<circle cx="50" cy="50" r="3" fill="#7fe0a8"/>'
    + '</svg>';
  var nav = '<div class="nav"><span class="nd-to">TO '+dest+'</span><span class="nd-from">FROM '+dep+'</span><span class="nd-hdg">HDG '+CRUISE_HDG+'°</span><span class="nd-rng">RNG 40NM</span></div>';
  return '<div class="mfd'+(wide?' wide':'')+'">'+svg+nav+tag+'</div>';
}
function mfdSimple(label){ return '<div class="mfd"><div class="att"><div class="sky"></div><div class="gnd"></div><div class="hl"></div></div><span class="lbl">'+label+'</span></div>'; }
function gaugeHTML(name){ return '<div class="gauge"><div class="ticks"></div><span class="needle"></span><span class="cap"></span><span>'+name+'</span><span class="v" data-g="'+name+'">0</span></div>'; }

function mcpCol(n, k){ var s='<div class="mcp-sec"><div class="mcp-row">'; for(var i=0;i<n;i++){ s+='<div class="mcp-knob'+(k?' kn':'')+'"></div>'; } return s+'</div></div>'; }
function mcpHTML(){ return '<div class="cp-mcp"><div class="mcp-secs">'+mcpCol(3)+mcpCol(3,1)+mcpCol(3)+mcpCol(3,1)+'</div><div class="mcp-row" style="margin-top:2px"><div class="mcp-caution">MC</div><div class="mcp-lbl" style="margin:0 0 0 4px">MASTER CAUTION</div></div></div>'; }

function buildCockpit(){
  var el = document.getElementById("cockpit");
  el.className = (mode==="cockpit") ? ("show "+ac.cls) : "";
  var html = '<div class="cp-struct"></div><div class="cp-top"></div>'+mcpHTML()+'<div class="cp-dash"></div><div class="cp-pedestal"><div class="thr"></div><div class="thr"></div></div>';
  if(ac.style==="glass"){
    html += '<div class="cp-sub">CAPT</div><div class="cp-panel">'+pfdHTML("PFD","C",true)+ndHTML("ND","C",true)+ndHTML("ND","FO",true)+pfdHTML("PFD","FO",true)+'</div><div class="yoke"><div class="yoke-bar"></div><div class="yoke-grip l"></div><div class="yoke-grip r"></div><div class="yoke-hub"></div></div><div class="cp-label">ボーイング787 · YOKE · GLASS COCKPIT</div>';
  } else if(ac.style==="six"){
    html += '<div class="cp-sub">CAPT / FO</div><div class="cp-panel">'+pfdHTML("PFD","C")+ndHTML("ND","C")+pfdHTML("PFD","FO")+ndHTML("ND","FO")+mfdSimple("E/WD")+mfdSimple("SD")+'</div><div class="sstick"></div><div class="sstick r"></div><div class="cp-label">エアバスA350 · SIDE STICK · 6 DISPLAYS</div>';
  } else if(ac.style==="round"){
    html += '<div class="cp-panel">'+gaugeHTML("SPD")+gaugeHTML("ATT")+gaugeHTML("ALT")+gaugeHTML("HDG")+gaugeHTML("VSI")+gaugeHTML("N1")+'</div><div class="yoke"><div class="yoke-bar"></div><div class="yoke-grip l"></div><div class="yoke-grip r"></div><div class="yoke-hub"></div></div><div class="cp-label">ボーイング737 · YOKE · CLASSIC GAUGES</div>';
  } else {
    html += '<div class="cp-sub">CAPT / FO</div><div class="cp-panel">'+pfdHTML("PFD","C")+ndHTML("ND","C")+pfdHTML("PFD","FO")+ndHTML("ND","FO")+'</div><div class="sstick"></div><div class="cp-label">エアバスA321 · SIDE STICK · 4 DISPLAYS</div>';
  }
  el.innerHTML = html;
}

var mode = "cockpit";
var vbtnChase = document.getElementById("vChase");
var vbtnCockpit = document.getElementById("vCockpit");
function setMode(m){
  mode = m;
  vbtnChase.className = (m==="chase")?"on":"";
  vbtnCockpit.className = (m==="cockpit")?"on":"";
  document.getElementById("cockpit").className = (m==="cockpit") ? ("show "+ac.cls) : "";
}
vbtnChase.onclick = function(){ setMode("chase"); };
vbtnCockpit.onclick = function(){ setMode("cockpit"); };
setMode("cockpit");
buildCockpit();

var t=0, PHASE=["タキシング","停止（機材交換）","離陸","巡航","着陸"], phaseIdx=0, alt=0, spd=0, pitch=0, roll=0, hdg=0;
var PH_END=[150, 270, 510, 690, 1110];
var PH_START=[0, 150, 270, 510, 690];
var totalDur=1110;
var dist=0;
var prevAlt=0;

function update(dt){
  t += dt;
  phaseIdx = t<PH_END[0]?0:(t<PH_END[1]?1:(t<PH_END[2]?2:(t<PH_END[3]?3:4)));
  phaseEl.textContent = PHASE[phaseIdx];
  var s=PH_START[phaseIdx], e=PH_END[phaseIdx], k=Math.min((t-s)/(e-s),1);

  // 巡航中は雲を非表示にして晴れっぽい空にする
  clouds.forEach(function(cl){ cl.visible = (phaseIdx !== 3); });

  var VR = ac.vr || 150;
  var touchdown = (phaseIdx===4 && k>=0.55);
  if(phaseIdx===0){ spd=60*k; alt=0; pitch=0; }
  else if(phaseIdx===1){
    var decel = Math.min(k/0.3,1);
    spd = 60 * (1 - (decel*decel*(3-2*decel)));
    alt=0; pitch=0;
  }
  else if(phaseIdx===2){
    if(k<0.25){ spd=60+(VR-60)*(k/0.25); alt=0; pitch=0; }
    else {
      var r=(k-0.25)/0.75;
      spd = VR + (VCR-VR) * (1 - Math.pow(1-r, 2));
      alt = CRUISE_ALT * (1 - Math.pow(1-r, 2.2));
      pitch = smooth(10, 4, r);
    }
  }
  else if(phaseIdx===3){ spd=VCR; alt=CRUISE_ALT + Math.sin(t*0.6)*30; pitch=2; }
  else {
    if(k<0.55){
      var ra=k/0.55;
      // 着陸は速度を下げながら、よりゆっくり降下（段階を増やす）
      spd = VCR * (1 - 0.55*ra);
      alt = stagedDescend(ra, 8);
      pitch = smooth(-8,-15,ra);
    }
    else { var rb=(k-0.55)/0.45; spd=(VCR*0.45)*(1-rb); alt=0; pitch=0; if(rb>0.97){ spd=0; } }
  }
  var airborne = alt > 1000;
  var highUp = alt > 8000;
  var turb = (acc==="乱気流" && highUp);
  roll = airborne ? (Math.sin(t*0.7)*4 + (turb? Math.sin(t*5.5)*9:0)) : 0;
  var hdgWob = turb ? Math.sin(t*2.5)*4 : 0;
  hdg = CRUISE_HDG + hdgWob;
  if(turb) pitch += Math.sin(t*4.2)*3;

  gearGroup.visible = alt < 1000;

  var vsi = (dt>0) ? ((alt - prevAlt) / dt) * 60 : 0;
  prevAlt = alt;

  if(spd>0.5){ dist += spd*dt*0.03; }
  // 破線は固定。機体の速度と同じペースで流れて見える（速度に比例した流れ）
  var planeZ = -1400 + dist;
  if(phaseIdx===4){
    var rL = (t-690)/420;
    planeZ = planeZ + (-900 - planeZ) * Math.min(rL*1.15,1);
  }
  planeGroup.position.set(0, alt-29+0.9, planeZ);
  planeGroup.rotation.set(THREE.MathUtils.degToRad(roll), THREE.MathUtils.degToRad(-90 + hdgWob*0.6), THREE.MathUtils.degToRad(pitch));

  if(rain){ var rp2=rain.geometry.attributes.position.array; for(var i3=0;i3<rp2.length;i3+=3){ rp2[i3+1]-=60*dt; if(rp2[i3+1]<-10){ rp2[i3+1]=120; rp2[i3]=(Math.random()-0.5)*260; rp2[i3+2]=(Math.random()-0.5)*260; } } rain.geometry.attributes.position.needsUpdate=true; }
  if(snow){ var sp2=snow.geometry.attributes.position.array; for(var k3=0;k3<sp2.length;k3+=3){ sp2[k3+1]-=12*dt; if(sp2[k3+1]<-10){ sp2[k3+1]=120; sp2[k3]=(Math.random()-0.5)*260; sp2[k3+2]=(Math.random()-0.5)*260; } } snow.geometry.attributes.position.needsUpdate=true; }
  clouds.forEach(function(cl){ if(!cl.visible) return; cl.position.z -= cfg.drift*dt*50; if(cl.position.z < -16000){ cl.position.z = 11000 + Math.random()*4500; } });

  var spdLabel = ((phaseIdx===2 && k>=0.25) || phaseIdx===3 || (phaseIdx===4 && !touchdown)) ? "巡航速度" : "速度";
  rtEl.innerHTML = spdLabel+" "+Math.round(spd)+" kt<br>高度 "+Math.round(alt).toLocaleString()+" ft<br>ピッチ "+Math.round(pitch)+"°<br>VSI "+Math.round(vsi).toLocaleString()+" ft/min<br>進行方位 "+Math.round(hdg)+"°";

  var n1v = Math.round(88*(spd>1?1:0.2));
  document.querySelectorAll('.gauge').forEach(function(gEl){
    var gElName = gEl.querySelector('[data-g]');
    var g = gElName.getAttribute('data-g');
    var needle = gEl.querySelector('.needle');
    var val=0, ang=0;
    if(g==='SPD'){ val=spd; ang=-135+(spd/VCR)*270; }
    else if(g==='ATT'){ val=pitch; ang=-135+((pitch+30)/60)*270; }
    else if(g==='ALT'){ val=alt; ang=-135+(alt/30000)*270; }
    else if(g==='HDG'){ val=hdg; ang=-135+(hdg/360)*270; }
    else if(g==='VSI'){ val=vsi; ang=-135+((vsi+2000)/4000)*270; }
    else if(g==='N1'){ val=n1v; ang=-135+(n1v/100)*270; }
    gElName.textContent=Math.round(val);
    if(needle) needle.style.setProperty('--r', ang+'deg');
  });
  document.querySelectorAll(".mfd .hl").forEach(function(hl){ hl.style.transform='rotate('+(roll*0.5)+'deg)'; });

  if(mode==="cockpit"){
    planeGroup.visible = false;
    var off=new THREE.Vector3(ac.len/2-0.9,1.6,0); off.applyEuler(planeGroup.rotation);
    cam.position.copy(planeGroup.position).add(off);
    var lookAtPt = new THREE.Vector3(ac.len/2+900,6,0); lookAtPt.applyEuler(planeGroup.rotation); lookAtPt.add(planeGroup.position);
    cam.lookAt(lookAtPt);
    cam.fov=72;
  } else {
    planeGroup.visible = true;
    var back=new THREE.Vector3(-ac.len-20,11,0); back.applyEuler(planeGroup.rotation);
    cam.position.copy(planeGroup.position).add(back); cam.lookAt(planeGroup.position); cam.fov=55;
  }
  cam.updateProjectionMatrix();
}

var last=performance.now();
function loop(now){ var dt=Math.min((now-last)/1000,0.05); last=now; update(dt); renderer.render(scene,cam); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.addEventListener("resize", function(){ cam.aspect=window.innerWidth/window.innerHeight; cam.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
})();
</script>
</body>
</html>
