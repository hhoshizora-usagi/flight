<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フライト シミュレーター（3D）</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070b10;color:#e9eef2;font-family:Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#cv{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:13px;letter-spacing:.06em;z-index:5}
#hud .l{line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#hud .phase{font-size:20px;font-weight:700;color:#f5b13c}
#hud .cond{color:#c3d1dd;font-size:12px}
#hud .rt{color:#c3d1dd;font-size:12px;text-align:right;line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#back{position:fixed;left:16px;bottom:16px;border:1px solid #f5b13c;background:rgba(7,11,16,.75);color:#f5b13c;font:inherit;font-size:13px;letter-spacing:.06em;padding:10px 18px;border-radius:4px;cursor:pointer;text-decoration:none;z-index:6}
#back:hover{background:#f5b13c;color:#070b10}
#vt{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:6}
#vt button{border:1px solid #3a4a5a;background:rgba(7,11,16,.75);color:#c3d1dd;font:inherit;font-size:12px;letter-spacing:.06em;padding:9px 14px;border-radius:4px;cursor:pointer}
#vt button.on{border-color:#f5b13c;color:#f5b13c;background:rgba(245,177,60,.12)}
#cockpit{position:fixed;inset:0;pointer-events:none;display:none;z-index:3;font-family:Arial,"Noto Sans JP",sans-serif}
#cockpit.show{display:block}
.cp-struct{position:absolute;inset:0;pointer-events:none}
.cp-struct:before{content:"";position:absolute;left:0;top:0;bottom:0;width:13%;background:linear-gradient(90deg,#0a0f15 40%,rgba(10,15,21,0))}
.cp-struct:after{content:"";position:absolute;right:0;top:0;bottom:0;width:13%;background:linear-gradient(270deg,#0a0f15 40%,rgba(10,15,21,0))}
.cp-top{position:absolute;left:0;right:0;top:0;height:11%;background:linear-gradient(180deg,#0b1118 20%,rgba(11,17,24,0))}
.cp-overhead{position:absolute;left:50%;top:0;transform:translateX(-50%);width:50%;height:9%;background:linear-gradient(180deg,#111a24,#0a1018);border:1px solid #1e2c3a;border-top:0;border-radius:0 0 6px 6px;display:flex;align-items:center;justify-content:space-around;padding:0 3%}
.cp-sw{width:16px;height:16px;border-radius:3px;background:#1c2a37;border:1px solid #2f4256;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.cp-sw:before{content:"";position:absolute;left:50%;top:3px;width:2px;height:8px;background:#6a7f96;transform:translateX(-50%)}
.cp-sw.lit{background:#0e2b1c;border-color:#2f7a4a;box-shadow:0 0 8px rgba(60,220,120,.6), inset 0 0 4px rgba(60,220,120,.4)}
.cp-dash{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#1b242e 0%,#121922 22%,#080c12 100%);border-top:3px solid #2a3948;box-shadow:0 -10px 40px rgba(0,0,0,.65), inset 0 2px 0 rgba(255,255,255,.05)}
.cp-panel{position:absolute;top:36%;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;justify-content:center;width:82%}
.cp-label{position:absolute;bottom:1.2%;left:50%;transform:translateX(-50%);color:#5f7386;font-size:11px;letter-spacing:.24em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.cp-sub{position:absolute;top:32.5%;left:50%;transform:translateX(-50%);color:#4a5f73;font-size:9px;letter-spacing:.3em}
.mfd{width:112px;height:76px;border-radius:4px;overflow:hidden;border:2px solid #26323d;box-shadow:0 4px 14px rgba(0,0,0,.55);position:relative;flex:none;background:#050a10}
.mfd .att{position:absolute;inset:0}
.mfd .sky{position:absolute;left:0;right:0;top:0;height:54%;background:linear-gradient(180deg,#2f6fa8,#5093c8)}
.mfd .gnd{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,#8a5a26,#5f4016)}
.mfd .hl{position:absolute;left:8%;right:8%;top:54%;height:2px;background:#eef4fa;box-shadow:0 0 5px rgba(0,0,0,.7)}
.mfd .pitch{position:absolute;left:50%;top:54%;width:30px;height:30px;border-left:1px solid rgba(255,255,255,.6);border-right:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}
.mfd .tick{position:absolute;left:50%;top:54%;width:60px;height:1px;background:rgba(255,255,255,.45);transform:translate(-50%,0)}
.mfd .lbl{position:absolute;left:6px;top:4px;font-size:8px;letter-spacing:.12em;color:#e6f0f8;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
.mfd .lbl b{color:#7fc4ea;font-size:7px}
.mfd .tape{position:absolute;right:5px;top:12px;bottom:12px;width:14px;background:rgba(0,0,0,.5);border:1px solid rgba(111,185,232,.5);display:flex;flex-direction:column;justify-content:space-between;font-size:7px;color:#cfeaff;padding:2px 0;align-items:center}
.mfd .spd{position:absolute;left:5px;top:12px;bottom:12px;width:14px;background:rgba(0,0,0,.5);border:1px solid rgba(111,185,232,.5);display:flex;flex-direction:column;justify-content:space-between;font-size:7px;color:#cfeaff;padding:2px 0;align-items:center}
.mfd.wide{width:150px}
.nd-rose{position:absolute;left:50%;top:50%;width:78px;height:78px;transform:translate(-50%,-50%);opacity:.95}
.nd-rose text{font-family:"Courier New",monospace;fill:#9fe3c0;font-size:9px}
.nav{position:absolute;inset:0;pointer-events:none}
.nav .nd-to{position:absolute;left:7px;top:6px;font-size:10px;font-weight:700;color:#c8fad8;font-family:"Courier New",monospace;text-shadow:0 0 6px rgba(100,255,180,.4)}
.nav .nd-from{position:absolute;left:7px;bottom:7px;font-size:8px;color:#6fbf92;font-family:"Courier New",monospace}
.nav .nd-hdg{position:absolute;right:7px;top:6px;font-size:8px;color:#8fd8b0;font-family:"Courier New",monospace}
.nav .nd-rng{position:absolute;right:7px;bottom:7px;font-size:8px;color:#5fae82;font-family:"Courier New",monospace}
.gauge{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b333d,#0b0f14);border:2px solid #45505c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd27a;font-size:8px;letter-spacing:.06em;position:relative;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.gauge .ticks{position:absolute;inset:5px;border-radius:50%;background:repeating-conic-gradient(from -140deg,rgba(255,210,122,.9) 0deg 2deg,transparent 2deg 26deg);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%)}
.gauge .needle{position:absolute;left:50%;top:50%;width:26px;height:2px;background:#ffd27a;transform-origin:right center;transform:translate(-100%,-50%) rotate(var(--r,0deg));box-shadow:0 0 5px rgba(255,210,122,.8)}
.gauge .cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#ffd27a;box-shadow:0 0 4px rgba(255,210,122,.8)}
.gauge .v{font-size:12px;font-weight:700;color:#ffe9b8;line-height:1.1;margin-top:10px}
.cp-pedestal{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:22%;height:16%;background:linear-gradient(180deg,#131c26,#0b1118);border:1px solid #24333f;border-radius:4px 4px 0 0;display:flex;align-items:flex-start;justify-content:center;gap:28px;padding-top:8px}
.thr{width:12px;height:50px;background:linear-gradient(180deg,#26343f,#121a22);border:1px solid #33465a;border-radius:3px;position:relative}
.thr:before{content:"";position:absolute;left:-4px;top:34%;width:20px;height:16px;border-radius:4px;background:linear-gradient(180deg,#4a5c6e,#2c3a46);border:1px solid #5a7088;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.yoke{position:absolute;bottom:27%;left:50%;transform:translateX(-50%);width:210px;height:52px}
.yoke-bar{position:absolute;left:8%;right:8%;top:2px;height:12px;border-radius:6px;background:linear-gradient(180deg,#4d5c6c,#2c3946);border:1px solid #5c6f82;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.yoke-grip{position:absolute;top:0;width:32px;height:36px;border-radius:8px;background:linear-gradient(180deg,#4d5c6c,#2c3946);border:1px solid #5c6f82;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.yoke-grip.l{left:4%}.yoke-grip.r{right:4%}
.yoke-hub{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4a5a,#1f2830);border:2px solid #55697d;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.sstick{position:absolute;bottom:25%;left:26%;width:15px;height:62px;border-radius:8px;background:linear-gradient(180deg,#3a4a5a,#232e38);border:2px solid #55697d;transform:rotate(-15deg);box-shadow:0 4px 12px rgba(0,0,0,.55)}
.sstick:before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:24px;height:26px;border-radius:7px;background:linear-gradient(180deg,#4a5a6a,#2c3946);border:2px solid #55697d}
.ct-787 .cp-dash{height:30%;background:linear-gradient(180deg,#16202a,#0a1016 70%)}
.ct-a350 .cp-dash{height:26%;background:linear-gradient(180deg,#101a26,#070c12 80%)}
.ct-a350 .mfd{width:96px;height:62px}
.ct-737 .cp-dash{height:40%;background:linear-gradient(180deg,#232b34,#11161c 80%)}
.ct-a321 .cp-dash{height:28%;background:linear-gradient(180deg,#0f1924,#070c12 80%)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="l"><div class="phase" id="phase">タキシング</div><div class="cond" id="cond"></div></div>
  <div class="rt" id="rt"></div>
</div>
<div id="cockpit"></div>
<div id="vt">
  <button id="vChase">後方視点</button>
  <button id="vCockpit">コックピット</button>
</div>
<a id="back" href="index.html">← すごろくに戻る</a>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
"use strict";
var q = new URLSearchParams(location.search);
var dep = q.get("dep") || "羽田";
var dest = q.get("dest") || "那覇";
var plane = q.get("plane") || "ボーイング787";
var weather = q.get("weather") || "晴れ";
var acc = q.get("acc") || "なし";

var AC = {
  "ボーイング787": { len:20, span:28, color:0xdfe6ee, cls:"ct-787", sideStick:false, style:"glass", vr:152 },
  "エアバスA350": { len:19, span:27, color:0xe8edf2, cls:"ct-a350", sideStick:true, style:"six", vr:148 },
  "ボーイング737": { len:15, span:22, color:0xd8dee6, cls:"ct-737", sideStick:false, style:"round", vr:142 },
  "エアバスA321": { len:14, span:21, color:0xe4e9ef, cls:"ct-a321", sideStick:true, style:"four", vr:138 }
};
var ac = AC[plane] || AC["ボーイング787"];

var CRUISE_HDG = 92;
var CRUISE_ALT = 30000;

function smooth(a, b, x){ x = Math.max(0, Math.min(1, x)); var u = x*x*(3-2*x); return a + (b-a)*u; }

// 数段階に分けて徐々に降りる高度
function stagedDescend(progress, stages){
  var x = Math.min(progress*stages, stages-0.0001);
  var i = Math.floor(x);
  var f = x - i;
  var e = f*f*(3-2*f);
  return CRUISE_ALT * (1 - (i + e) / stages);
}

document.getElementById("cond").textContent = dep + " → " + dest + " / " + plane + " / " + weather + (acc && acc!=="なし" ? " / " + acc : "");
var rtEl = document.getElementById("rt");
var phaseEl = document.getElementById("phase");

var canvas = document.getElementById("cv");
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);

var scene = new THREE.Scene();
var cam = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.5, 300000);

var SKYC = { "晴れ":[0x1e6fb8,0xbfe0f5], "くもり":[0x7f95a8,0xc7d2da], "雨":[0x3d4c59,0x8a99a6], "雪":[0x7d8b98,0xd3dbe2], "霧":[0x9aa6b0,0xc9d1d8], "向かい風":[0x1e6fb8,0xbfe0f5], "追い風":[0x1e6fb8,0xbfe0f5] };
var sc = SKYC[weather] || SKYC["晴れ"];
var skyTop = new THREE.Color(sc[0]), skyBot = new THREE.Color(sc[1]);
var fogColor = skyBot.clone().lerp(skyTop, 0.35);
scene.fog = new THREE.Fog(fogColor, weather==="霧"?60:(weather==="雨"?250:500), weather==="霧"?340:(weather==="雨"?1000:1800));

// sky as gradient background (reliable at high altitude)
var skyCanvas = document.createElement("canvas");
skyCanvas.width = 4; skyCanvas.height = 256;
var sctx = skyCanvas.getContext("2d");
var lg = sctx.createLinearGradient(0,0,0,256);
lg.addColorStop(0, "#"+skyTop.getHexString());
lg.addColorStop(1, "#"+skyBot.getHexString());
sctx.fillStyle = lg;
sctx.fillRect(0,0,4,256);
var skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.magFilter = THREE.LinearFilter;
scene.background = skyTex;

var sun = new THREE.DirectionalLight(0xfff2d0, 1.6); sun.position.set(120,420,80); scene.add(sun);
var hemi = new THREE.HemisphereLight(0xffffff, 0x2a3a2a, 0.9); scene.add(hemi);
var sunDisk = new THREE.Mesh(new THREE.SphereGeometry(60,16,12), new THREE.MeshBasicMaterial({color:0xfff4d6}));
sunDisk.position.set(900,2100,-2200); scene.add(sunDisk);

var gGeo = new THREE.PlaneGeometry(6000,6000,120,120); gGeo.rotateX(-Math.PI/2);
var gp = gGeo.attributes.position;
for(var gi=0;gi<gp.count;gi++){ var gx=gp.getX(gi), gz=gp.getZ(gi); var dist0=Math.sqrt(gx*gx+gz*gz); var amp=Math.min(dist0/900,1); var h=(Math.sin(gx*0.0035)*9+Math.cos(gz*0.0028)*12+Math.sin((gx+gz)*0.0019)*15)*amp; gp.setY(gi,h); }
gGeo.computeVertexNormals();
var ground = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({color:0x2f4a2c, roughness:1})); ground.position.y=-30; scene.add(ground);
var water = new THREE.Mesh(new THREE.PlaneGeometry(6000,2400), new THREE.MeshStandardMaterial({color:0x1b4c74, roughness:0.35, metalness:0.3})); water.rotation.x=-Math.PI/2; water.position.set(0,-31.2,3200); scene.add(water);
for(var bi=0;bi<40;bi++){ var bh=20+Math.random()*90; var b=new THREE.Mesh(new THREE.BoxGeometry(14+Math.random()*16,bh,14+Math.random()*16), new THREE.MeshStandardMaterial({color:0x3a4652, roughness:0.85})); b.position.set(-900+Math.random()*1800,-30+bh/2,-1600-Math.random()*1200); scene.add(b); }

var runway = new THREE.Mesh(new THREE.PlaneGeometry(120,3400), new THREE.MeshStandardMaterial({color:0x5b646d, roughness:0.7, emissive:0x1a2026, emissiveIntensity:0.6})); runway.rotation.x=-Math.PI/2; runway.position.set(0,-29.75,-900); scene.add(runway);
var dashMat = new THREE.MeshBasicMaterial({color:0xf2f6fa});
for(var di=0;di<50;di++){ var d=new THREE.Mesh(new THREE.PlaneGeometry(6,40), dashMat); d.rotation.x=-Math.PI/2; d.position.set(0,-29.1,-1450+di*70); scene.add(d); }

// runway edge lights
var edgeLampMat = new THREE.MeshBasicMaterial({color:0xfff0c0});
for(var ei=0; ei<26; ei++){
  var ez = -2450 + ei*95;
  for(var sd=-1; sd<=1; sd+=2){
    var el2 = new THREE.Mesh(new THREE.SphereGeometry(2.0,8,6), edgeLampMat);
    el2.position.set(sd*62, -29.2, ez); scene.add(el2);
  }
}
// approach lights leading in from the approach side
var appLampMat = new THREE.MeshBasicMaterial({color:0xffe9a8});
for(var ai=0; ai<10; ai++){
  var ap = new THREE.Mesh(new THREE.SphereGeometry(1.8,8,6), appLampMat);
  ap.position.set(0, -29.2, -2470 - ai*60); scene.add(ap);
}
// runway direction numbers (09 at west threshold, 27 at east threshold)
function makeRwyNum(txt){
  var rcv = document.createElement("canvas"); rcv.width=256; rcv.height=256;
  var rcx = rcv.getContext("2d");
  rcx.clearRect(0,0,256,256);
  rcx.fillStyle = "#f2f6fa"; rcx.font = "bold 190px Arial";
  rcx.textAlign="center"; rcx.textBaseline="middle";
  rcx.fillText(txt, 128, 128);
  var rtx = new THREE.CanvasTexture(rcv);
  var m = new THREE.Mesh(new THREE.PlaneGeometry(36,36), new THREE.MeshBasicMaterial({map:rtx, transparent:true}));
  m.rotation.x=-Math.PI/2;
  return m;
}
var rn09 = makeRwyNum("09"); rn09.position.set(0,-29.5,-2380); scene.add(rn09);
var rn27 = makeRwyNum("27"); rn27.rotation.z=Math.PI; rn27.position.set(0,-29.5,720); scene.add(rn27);

var CLOUD_CFG = {
  "晴れ":     { n:16, color:0xffffff, op:0.55, drift:10 },
  "くもり":   { n:36, color:0xdfe6ec, op:0.72, drift:8 },
  "雨":       { n:44, color:0x8a97a2, op:0.8,  drift:18 },
  "雪":       { n:38, color:0xffffff, op:0.88, drift:6 },
  "霧":       { n:52, color:0xdfe6ec, op:0.92, drift:3 },
  "向かい風": { n:22, color:0xffffff, op:0.55, drift:26 },
  "追い風":   { n:18, color:0xffffff, op:0.5,  drift:5 }
};
var cfg = CLOUD_CFG[weather] || CLOUD_CFG["晴れ"];
var cloudMat = new THREE.MeshLambertMaterial({color:cfg.color, transparent:true, opacity:cfg.op, fog:false});
var clouds=[];
for(var c=0;c<cfg.n;c++){
  var cl=new THREE.Mesh(new THREE.SphereGeometry(200+Math.random()*300,10,8), cloudMat);
  cl.scale.set(1.7,0.7,1.3);
  cl.position.set((Math.random()-0.5)*9000, 25000+Math.random()*9000, -13000+Math.random()*21000);
  scene.add(cl); clouds.push(cl);
}

var planeGroup = new THREE.Group(); scene.add(planeGroup);
var bodyMat = new THREE.MeshStandardMaterial({color:ac.color, roughness:0.45, metalness:0.2});
var wingMat = new THREE.MeshStandardMaterial({color:0xc7d0d9, roughness:0.55});
var glassMat = new THREE.MeshStandardMaterial({color:0x22303c, roughness:0.15, metalness:0.5});
var stripeMat = new THREE.MeshStandardMaterial({color:0x2d6fb0, roughness:0.5});
var fus = new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,ac.len,20), bodyMat); fus.rotation.z=Math.PI/2; planeGroup.add(fus);
var belly = new THREE.Mesh(new THREE.BoxGeometry(ac.len*0.9,1.2,2.6), wingMat); belly.position.set(0,-1.4,0); planeGroup.add(belly);
var nose = new THREE.Mesh(new THREE.ConeGeometry(2.1,3.4,20), bodyMat); nose.rotation.z=-Math.PI/2; nose.position.x=ac.len/2+1.5; planeGroup.add(nose);
var ck = new THREE.Mesh(new THREE.SphereGeometry(1.4,14,12), glassMat); ck.scale.set(1,0.8,1); ck.position.set(ac.len/2-0.6,0.9,0); planeGroup.add(ck);
var wingL = new THREE.Mesh(new THREE.BoxGeometry(ac.span*0.46,0.45,5.5), wingMat); wingL.position.set(-1.5,-0.3,-ac.span*0.22); wingL.rotation.y=-0.12; planeGroup.add(wingL);
var wingR = new THREE.Mesh(new THREE.BoxGeometry(ac.span*0.46,0.45,5.5), wingMat); wingR.position.set(-1.5,-0.3,ac.span*0.22); wingR.rotation.y=0.12; planeGroup.add(wingR);
var strL = new THREE.Mesh(new THREE.BoxGeometry(ac.len*0.85,0.35,0.08), stripeMat); strL.position.set(0,0.3,2.12); planeGroup.add(strL);
var strR = new THREE.Mesh(new THREE.BoxGeometry(ac.len*0.85,0.35,0.08), stripeMat); strR.position.set(0,0.3,-2.12); planeGroup.add(strR);
for(var e=-1;e<=1;e+=2){ var eng=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.05,4.4,14), bodyMat); eng.rotation.x=Math.PI/2; eng.position.set(-1.5,-1.15,e*ac.span*0.34); planeGroup.add(eng); var fan=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,0.3,14), glassMat); fan.rotation.x=Math.PI/2; fan.position.set(-0.65,-1.15,e*ac.span*0.34); planeGroup.add(fan); }
var vfin = new THREE.Mesh(new THREE.BoxGeometry(0.45,5.4,4.8), wingMat); vfin.position.set(-ac.len/2+1,2.6,0); planeGroup.add(vfin);
var hstab = new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,9.5), wingMat); hstab.position.set(-ac.len/2+0.6,0.7,0); planeGroup.add(hstab);

var rain=null, snow=null;
if(weather==="雨"){ var rn=1600,rg=new THREE.BufferGeometry(); var rp=new Float32Array(rn*3); for(var i2=0;i2<rn;i2++){ rp[i2*3]=(Math.random()-0.5)*260; rp[i2*3+1]=Math.random()*130-10; rp[i2*3+2]=(Math.random()-0.5)*260; } rg.setAttribute("position",new THREE.BufferAttribute(rp,3)); rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0xaac4dd,size:0.6,transparent:true,opacity:0.7})); scene.add(rain); }
if(weather==="雪"){ var sn=1000,sg=new THREE.BufferGeometry(); var sp=new Float32Array(sn*3); for(var j2=0;j2<sn;j2++){ sp[j2*3]=(Math.random()-0.5)*260; sp[j2*3+1]=Math.random()*130-10; sp[j2*3+2]=(Math.random()-0.5)*260; } sg.setAttribute("position",new THREE.BufferAttribute(sp,3)); snow=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.1,transparent:true,opacity:0.85})); scene.add(snow); }

function pfdHTML(label, side, wide){
  var tag = '<span class="lbl">'+label+(side?' <b>'+side+'</b>':'')+'</span>';
  return '<div class="mfd'+(wide?' wide':'')+'"><div class="att"><div class="sky"></div><div class="gnd"></div><div class="hl"></div><div class="pitch"></div><div class="tick" style="top:44%"></div><div class="tick" style="top:64%"></div></div>'+tag+'<span class="spd"><span>240</span><span>260</span><span>280</span></span><span class="tape"><span>090</span><span>092</span><span>094</span></span></div>';
}
function ndHTML(label, side, wide){
  var tag = '<span class="lbl">'+label+(side?' <b>'+side+'</b>':'')+'</span>';
  var svg = '<svg class="nd-rose" viewBox="0 0 100 100">'
    + '<circle cx="50" cy="50" r="38" fill="none" stroke="rgba(111,232,160,.3)" stroke-width="1"/>'
    + '<circle cx="50" cy="50" r="30" fill="none" stroke="rgba(111,232,160,.15)" stroke-width="1"/>'
    + '<text x="50" y="11">N</text>'
    + '<line x1="50" y1="74" x2="50" y2="30" stroke="rgba(170,255,205,.85)" stroke-width="1.4" stroke-dasharray="4 3"/>'
    + '<polygon points="50,26 45,35 55,35" fill="#c8fad8"/>'
    + '<circle cx="50" cy="62" r="2.6" fill="#b5f5c8"/>'
    + '<circle cx="50" cy="50" r="3" fill="#7fe0a8"/>'
    + '</svg>';
  var nav = '<div class="nav"><span class="nd-to">TO '+dest+'</span><span class="nd-from">FROM '+dep+'</span><span class="nd-hdg">HDG '+CRUISE_HDG+'°</span><span class="nd-rng">RNG 40NM</span></div>';
  return '<div class="mfd'+(wide?' wide':'')+'">'+svg+nav+tag+'</div>';
}
function mfdSimple(label){ return '<div class="mfd"><div class="att"><div class="sky"></div><div class="gnd"></div><div class="hl"></div></div><span class="lbl">'+label+'</span></div>'; }
function gaugeHTML(name){ return '<div class="gauge"><div class="ticks"></div><span class="needle"></span><span class="cap"></span><span>'+name+'</span><span class="v" data-g="'+name+'">0</span></div>'; }
function overheadHTML(n){ var h='<div class="cp-overhead">'; for(var i=0;i<n;i++){ h+='<div class="cp-sw'+(i%3===0?' lit':'')+'"></div>'; } return h+'</div>'; }
function buildCockpit(){
  var el = document.getElementById("cockpit");
  el.className = (mode==="cockpit") ? ("show "+ac.cls) : "";
  var html = '<div class="cp-struct"></div><div class="cp-top"></div>'+overheadHTML(9)+'<div class="cp-dash"></div><div class="cp-pedestal"><div class="thr"></div><div class="thr"></div></div>';
  if(ac.style==="glass"){
    html += '<div class="cp-sub">CAPT</div><div class="cp-panel">'+pfdHTML("PFD","C",true)+ndHTML("ND","C",true)+ndHTML("ND","FO",true)+pfdHTML("PFD","FO",true)+'</div><div class="yoke"><div class="yoke-bar"></div><div class="yoke-grip l"></div><div class="yoke-grip r"></div><div class="yoke-hub"></div></div><div class="cp-label">ボーイング787 · YOKE · GLASS COCKPIT</div>';
  } else if(ac.style==="six"){
    html += '<div class="cp-sub">CAPT / FO</div><div class="cp-panel">'+pfdHTML("PFD","C")+ndHTML("ND","C")+pfdHTML("PFD","FO")+ndHTML("ND","FO")+mfdSimple("E/WD")+mfdSimple("SD")+'</div><div class="sstick"></div><div class="cp-label">エアバスA350 · SIDE STICK · 6 DISPLAYS</div>';
  } else if(ac.style==="round"){
    html += '<div class="cp-panel">'+gaugeHTML("SPD")+gaugeHTML("ATT")+gaugeHTML("ALT")+gaugeHTML("HDG")+gaugeHTML("VSI")+gaugeHTML("N1")+'</div><div class="yoke"><div class="yoke-bar"></div><div class="yoke-grip l"></div><div class="yoke-grip r"></div><div class="yoke-hub"></div></div><div class="cp-label">ボーイング737 · YOKE · CLASSIC GAUGES</div>';
  } else {
    html += '<div class="cp-sub">CAPT / FO</div><div class="cp-panel">'+pfdHTML("PFD","C")+ndHTML("ND","C")+pfdHTML("PFD","FO")+ndHTML("ND","FO")+'</div><div class="sstick"></div><div class="cp-label">エアバスA321 · SIDE STICK · 4 DISPLAYS</div>';
  }
  el.innerHTML = html;
}

var mode = "cockpit";
var vbtnChase = document.getElementById("vChase");
var vbtnCockpit = document.getElementById("vCockpit");
function setMode(m){
  mode = m;
  vbtnChase.className = (m==="chase")?"on":"";
  vbtnCockpit.className = (m==="cockpit")?"on":"";
  document.getElementById("cockpit").className = (m==="cockpit") ? ("show "+ac.cls) : "";
}
vbtnChase.onclick = function(){ setMode("chase"); };
vbtnCockpit.onclick = function(){ setMode("cockpit"); };
setMode("cockpit");
buildCockpit();

var t=0, PHASE=["タキシング","離陸","巡航","着陸"], phaseIdx=0, alt=0, spd=0, pitch=0, roll=0, hdg=0;
var PH_END=[20,260,440,860];
var PH_START=[0,20,260,440];
var totalDur=860;
var dist=0;

function update(dt){
  t += dt;
  phaseIdx = t<PH_END[0]?0:(t<PH_END[1]?1:(t<PH_END[2]?2:3));
  phaseEl.textContent = PHASE[phaseIdx];
  var s=PH_START[phaseIdx], e=PH_END[phaseIdx], k=Math.min((t-s)/(e-s),1);

  var VR = ac.vr || 150;
  var touchdown = (phaseIdx===3 && k>=0.55);
  if(phaseIdx===0){ spd=60*k; alt=0; pitch=0; }
  else if(phaseIdx===1){
    if(k<0.25){ spd=60+(VR-60)*(k/0.25); alt=0; pitch=0; }
    else { var r=(k-0.25)/0.75; spd=smooth(VR,280,r); alt=smooth(0,CRUISE_ALT,r); pitch=smooth(10,24,r); }
  }
  else if(phaseIdx===2){ spd=280; alt=CRUISE_ALT + Math.sin(t*0.6)*30; pitch=2; }
  else {
    if(k<0.55){ var ra=k/0.55; spd=280; alt=stagedDescend(ra,6); pitch=smooth(-8,-15,ra); }
    else { var rb=(k-0.55)/0.45; spd=280*(1-rb); alt=0; pitch=0; if(rb>0.97){ spd=0; } }
  }
  roll = Math.sin(t*0.7)*4 + (acc==="乱気流"? Math.sin(t*5.5)*9:0);
  var hdgWob = (acc==="乱気流") ? Math.sin(t*2.5)*4 : 0;
  hdg = CRUISE_HDG + hdgWob;
  if(acc==="乱気流") pitch += Math.sin(t*4.2)*3;

  if(spd>0.5){ dist += spd*dt*0.03; }
  planeGroup.position.set(0, alt-29+0.9, -1400 + dist);
  planeGroup.rotation.set(THREE.MathUtils.degToRad(pitch), THREE.MathUtils.degToRad(-90 + hdgWob*0.6), THREE.MathUtils.degToRad(roll));

  if(rain){ var rp2=rain.geometry.attributes.position.array; for(var i3=0;i3<rp2.length;i3+=3){ rp2[i3+1]-=60*dt; if(rp2[i3+1]<-10){ rp2[i3+1]=120; rp2[i3]=(Math.random()-0.5)*260; rp2[i3+2]=(Math.random()-0.5)*260; } } rain.geometry.attributes.position.needsUpdate=true; }
  if(snow){ var sp2=snow.geometry.attributes.position.array; for(var k3=0;k3<sp2.length;k3+=3){ sp2[k3+1]-=12*dt; if(sp2[k3+1]<-10){ sp2[k3+1]=120; sp2[k3]=(Math.random()-0.5)*260; sp2[k3+2]=(Math.random()-0.5)*260; } } snow.geometry.attributes.position.needsUpdate=true; }
  clouds.forEach(function(cl){ cl.position.z -= cfg.drift*dt*50; if(cl.position.z < -16000){ cl.position.z = 11000 + Math.random()*4500; } });

  var spdLabel = (phaseIdx===2 || (phaseIdx===3 && !touchdown)) ? "巡行速度" : "速度";
  rtEl.innerHTML = spdLabel+" "+Math.round(spd)+" kt<br>高度 "+Math.round(alt).toLocaleString()+" ft<br>ピッチ "+Math.round(pitch)+"°<br>進行方位 "+Math.round(hdg)+"°";

  document.querySelectorAll('[data-g]').forEach(function(el){
    var g=el.getAttribute('data-g'); var val=0;
    if(g==='SPD') val=Math.round(spd); else if(g==='ATT') val=Math.round(pitch); else if(g==='ALT') val=Math.round(alt); else if(g==='HDG') val=Math.round(hdg); else if(g==='VSI') val=Math.round(Math.sin(t)*200); else if(g==='N1') val=Math.round(88*(spd>1?1:0.2));
    el.textContent=val;
  });
  document.querySelectorAll(".mfd .hl").forEach(function(hl){ hl.style.transform='rotate('+(roll*0.5)+'deg)'; });

  if(mode==="cockpit"){
    var off=new THREE.Vector3(ac.len/2-0.9,1.3,0); off.applyEuler(planeGroup.rotation);
    cam.position.copy(planeGroup.position).add(off); cam.rotation.copy(planeGroup.rotation); cam.fov=80;
  } else {
    var back=new THREE.Vector3(-ac.len-9,7.5,0); back.applyEuler(planeGroup.rotation);
    cam.position.copy(planeGroup.position).add(back); cam.lookAt(planeGroup.position); cam.fov=60;
  }
  cam.updateProjectionMatrix();
}

var last=performance.now();
function loop(now){ var dt=Math.min((now-last)/1000,0.05); last=now; update(dt); renderer.render(scene,cam); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.addEventListener("resize", function(){ cam.aspect=window.innerWidth/window.innerHeight; cam.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
})();
</script>
</body>
</html>
